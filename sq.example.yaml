# sq 配置示例
# 复制为 sq.yaml 后按需修改：cp sq.example.yaml sq.yaml
# 启动：./sq -config sq.yaml
# 说明：sq.yaml 已在 .gitignore，勿提交本机密钥与路径

# gRPC 监听地址
grpc_listen: ":8081"
# 路由响应中的对外地址；容器 / 远程访问时必改
advertise_host: "127.0.0.1"
advertise_port: 8081

# Pebble 数据目录（相对进程工作目录）
data_dir: "./data"
# 写盘策略：sync | async
fsync: sync

# 未知 topic 时自动创建
auto_create_topic: true
# 自动建 topic 的队列数（1..1024）
default_queue_nums: 16
# 新订阅组默认最大投递次数，超过转入 %DLQ%{group}
default_max_attempts: 16

# 过期清理扫描间隔（Go duration，如 5m、1h）
retention_check_interval: 5m
# 磁盘使用率超过即拒写保读；0 = 关闭；合法范围 [0,99]
disk_watermark_percent: 85

log_level: info # debug | info | warn | error

# —— 管理面（Admin HTTP + /metrics + 控制台静态资源）——
# "" = 关闭整个管理面
admin_listen: ":8082"
# 与 admin_password 成对；均空 = 免登录；只填一半启动报错
admin_username: ""
admin_password: ""

# —— gRPC 静态鉴权 ——
# 凭据列表；空/缺省 = 不做 gRPC 鉴权。每条 access_key/secret_key 必须成对，
# access_key 全局唯一；name 可选，仅用于日志追溯。
# credentials:
#   - name: 订单服务
#     access_key: "AK1"
#     secret_key: "SK1"
credentials: []

# 时序采样落库保留小时数；0 = 只留内存环最近 1 小时；上限 8760
metrics_retention_hours: 168

# —— 事务消息 ——
# 半消息回查间隔（Go duration）；单条最大回查次数，超限丢弃并记日志
txn_check_interval: 30s
txn_max_checks: 15

# —— 集群模式（V2，三节点主备）——
# 不填本段 = 单机模式（行为与 v1 完全一致）；段一旦出现即集群模式。
#
# 节点身份：node_id 必须出现在下方 peers 的 id 中；raft_listen 是本节点
# raft 组间复制流量的监听地址（与 grpc_listen 必须不同端口）。
# data_groups 数据组数：首启时持久化进盘、此后不可变（改配置不改盘上事实）。
# ack 确认档位：quorum-mem（日志 NoSync + 后台批量 fsync）| quorum-fsync
# （每条日志确认前带 fsync，最保守）。
# peers 成员表（含本节点）；1 个 = 单机→单节点集群升级形态。
#
# 不干净关机（断电 / kill -9 / OOM / panic）后的分级恢复，默认行为，无需配置：
#
# 1) 机器没重启过（进程崩溃而已）：本地 raft 日志完整——未 fsync 的写入
#    仍在系统页缓存里，一条不少。节点直接以原身份从本地日志恢复，不联系
#    任何人。三节点同时被 kill -9 也能各自起来、重新选主。
#
# 2) 机器重启过，且 ack 为 quorum-fsync：条目与投票每次变更都已落盘，
#    本地日志同样可信，直接以原身份恢复。
#
# 3) 机器重启过，且 ack 为 quorum-mem（默认档）：日志尾可能残缺（后台
#    刷盘周期 200ms，最多丢这么多）。节点先向存活 leader 求得接纳，
#    **拿到接纳之后才清空自己的数据目录**，再以 learner 身份重新加入。
#
# 4) 上一条求不到接纳（多数派不在、无 leader 可批准成员变更，典型是全集群
#    同时硬宕）：数据目录**保持原样不清空**，进程拒启。这不是保守，是因为
#    此刻本地这份数据是集群仅剩的兜底——先清空再去问「能不能重入」，问不到
#    时数据已经没了。
#
#    此时有两条出路：
#      a. 恢复多数派后重启本节点，自动走 3)
#      b. 全集群都起不来时，逐台执行下面的命令看现场并签字放行本地恢复：
#           sq recover -config <配置>            # 只看报告，不写任何东西
#           sq recover -config <配置> --grant    # 签字：接受最多丢 200ms
#         许可是一次性的，且绑定当次机器世代——机器再重启一次即自动失效，
#         不会被下一次事故静默复用。
#
# 如需保留现场排查，在集群启动前先备份数据目录。
#
# 三节点示例（每节点一份配置，node_id/raft_listen/grpc_listen 各自不同）：
# cluster:
#   node_id: 1
#   raft_listen: ":9081"
#   data_groups: 3
#   ack: quorum-mem
#   peers:
#     - id: 1
#       raft_addr: "127.0.0.1:9081"
#       advertise_host: "127.0.0.1"
#       advertise_port: 8081
#     - id: 2
#       raft_addr: "127.0.0.1:9082"
#       advertise_host: "127.0.0.1"
#       advertise_port: 8082
#     - id: 3
#       raft_addr: "127.0.0.1:9083"
#       advertise_host: "127.0.0.1"
#       advertise_port: 8083
#
# 单节点集群（单机升级形态）：
# cluster:
#   node_id: 1
#   raft_listen: ":9081"
#   data_groups: 3
#   ack: quorum-mem
#   peers:
#     - id: 1
#       raft_addr: "127.0.0.1:9081"
#       advertise_host: "127.0.0.1"
#       advertise_port: 8081
# 注意：不填 cluster 段 = 单机模式。本示例默认不带集群段，按上例
# 自行取消注释即可开启（复制即用的默认配置不应静默切换部署形态）。
