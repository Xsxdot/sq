version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/xushixin/sq/internal/rpc/pb
plugins:
  - local: protoc-gen-go
    out: internal/rpc/pb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/rpc/pb
    opt: paths=source_relative
