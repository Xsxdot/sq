<!--
  sq 控制台原型 · 总览

  职责：
    - 上半屏给整体信号：六项读数 + 写入/落后趋势图（1h/24h/7d）
    - 下半屏给全部消费关系总账，可逐行展开到队列级并就地发起操作

  边界：
    - 零依赖、纯 mock、file:// 直开（见 prototype-site/light-interaction.md）
    - 数据与渲染函数全部来自 shared/mock.js，页面内不另造假数据
-->
<meta charset="utf-8">
<title>sq 控制台 · 总览</title>
<link rel="stylesheet" href="shared/app.css">
<script src="shared/mock.js"></script>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><b>sq</b><span>SIMPLE QUEUE</span></div>
    <nav>
      <a href="index.html" class="nav-item active" aria-current="page">总览</a>
      <div class="nav-group">资源</div>
      <a href="pages/topics.html" class="nav-item">Topic</a>
      <a href="pages/groups.html" class="nav-item">消费组</a>
      <a href="pages/delay.html" class="nav-item">延时队列</a>
      <div class="nav-group">排查</div>
      <a href="pages/messages.html" class="nav-item">消息查询</a>
      <a href="pages/dlq.html" class="nav-item">死信队列</a>
      <a href="pages/send.html" class="nav-item">发送测试消息</a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="page-title">总览</span>
      <span class="spacer"></span>
      <span class="endpoint">127.0.0.1:8081</span>
      <span class="live"><i class="dot"></i>5s 后刷新</span>
      <button class="btn">立即刷新</button>
      <a class="btn" href="pages/login.html">退出登录</a>
    </header>

    <main class="content">
      <div class="strip">
        <div class="stat">
          <div><div class="stat-label">写入</div><div class="stat-val" id="v-qps"></div></div>
          <svg width="60" height="22" id="s-qps"></svg>
        </div>
        <div class="stat">
          <div><div class="stat-label">总落后</div><div class="stat-val" id="v-lag"></div></div>
          <svg width="60" height="22" id="s-lag"></svg>
        </div>
        <div class="stat">
          <div><div class="stat-label">在途</div><div class="stat-val" id="v-fly"></div></div>
          <svg width="60" height="22" id="s-fly"></svg>
        </div>
        <div class="stat">
          <div><div class="stat-label">延时待投</div><div class="stat-val" id="v-dly"></div></div>
          <svg width="60" height="22" id="s-dly"></svg>
        </div>
        <div class="stat">
          <div><div class="stat-label">死信</div><div class="stat-val bad" id="v-dlq"></div></div>
        </div>
        <div class="stat">
          <div><div class="stat-label">TOPIC / 消费组</div><div class="stat-val" id="v-res"></div></div>
        </div>
      </div>

      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">写入速率与落后</span>
          <span class="spacer"></span>
          <span class="legend">
            <span><i style="background:var(--chart-1)"></i>写入 msg/s</span>
            <span><i style="background:var(--chart-2)"></i>落后条数</span>
          </span>
          <div class="range" id="range">
            <button class="active" data-r="1h">1h</button>
            <button data-r="24h">24h</button>
            <button data-r="7d">7d</button>
          </div>
        </div>
        <div class="panel-body">
          <svg id="chart" width="100%" height="170" preserveAspectRatio="none"></svg>
          <div class="prog" id="chart-axis"></div>
          <div class="panel-note" id="chart-note" style="margin-top:8px"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">消费关系总账</span>
          <span class="panel-note">点任意一行展开到队列级</span>
          <span class="spacer"></span>
          <button class="chip" data-f="lag">只看落后的</button>
          <button class="chip" data-f="dlq">只看有死信</button>
          <span class="count" id="count"></span>
        </div>
        <table>
          <thead>
            <tr>
              <th style="width:3px"></th>
              <th>消费组 / TOPIC</th>
              <th style="width:132px">写入</th>
              <th style="width:220px">落后（同一刻度）</th>
              <th class="r" style="width:88px">落后</th>
              <th class="r" style="width:64px">在途</th>
              <th class="r" style="width:64px">死信</th>
              <th class="r" style="width:92px">最后消费</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </section>
    </main>
  </div>
</div>

<script>
  const o = SQ.overview;
  document.getElementById('v-qps').innerHTML = `${SQ.fmt(o.qps)}<small>msg/s</small>`;
  document.getElementById('v-lag').textContent = SQ.fmt(o.lag);
  document.getElementById('v-fly').textContent = SQ.fmt(o.inflight);
  document.getElementById('v-dly').textContent = SQ.fmt(o.delayDepth);
  document.getElementById('v-dlq').textContent = SQ.fmt(o.dlq);
  document.getElementById('v-res').textContent = `${o.topics} / ${o.groups}`;
  SQ.spark(document.getElementById('s-qps'), SQ.wave(24, 2400, 1200, 1), 'var(--chart-1)');
  SQ.spark(document.getElementById('s-lag'), SQ.wave(24, 5000, 3000, 2), 'var(--chart-2)');
  SQ.spark(document.getElementById('s-fly'), SQ.wave(24, 160, 90, 3), 'var(--text-3)');
  SQ.spark(document.getElementById('s-dly'), SQ.wave(24, 1100, 500, 4), 'var(--text-3)');

  // 三档范围对应两层数据源：1h 读内存环（5 秒粒度），24h/7d 读 Pebble（分钟粒度取峰值）
  const SERIES = {
    '1h':  { n: 72,  span: 3600000,        note: '近 1 小时 · 5 秒粒度 · 来自内存环形缓冲' },
    '24h': { n: 96,  span: 86400000,       note: '近 24 小时 · 1 分钟粒度取该分钟峰值 · 来自 Pebble' },
    '7d':  { n: 120, span: 86400000 * 7,   note: '近 7 天 · 1 分钟粒度取该分钟峰值 · 来自 Pebble' },
  };

  // 横轴刻度：跨度超过一天时补上日期，否则只给时分——没有时间标签就读不出「什么时候涨的」
  function axisLabel(ms, span) {
    const d = new Date(ms);
    const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    return span > 86400000 ? `${d.getMonth() + 1}-${d.getDate()} ${hm}` : hm;
  }

  function drawChart(range) {
    const { n, note, span } = SERIES[range];
    const qps = SQ.wave(n, 2400, 1500, range.length);
    const lag = SQ.wave(n, 5200, 3800, range.length + 4);
    const el = document.getElementById('chart');
    const w = el.clientWidth || 900, h = 170, pad = 12;
    const grid = [0, .25, .5, .75, 1].map(f => {
      const y = (pad + (h - pad * 2) * f).toFixed(1);
      return `<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="var(--chart-grid)"/>`;
    }).join('');
    const line = SQ.linePath(qps, w, h, pad);
    el.innerHTML = `${grid}
      <path d="${line} L${w - pad},${h - pad} L${pad},${h - pad} Z" fill="var(--chart-1-fp)"/>
      <path d="${line}" fill="none" stroke="var(--chart-1)" stroke-width="1.4"/>
      <path d="${SQ.linePath(lag, w, h, pad)}" fill="none" stroke="var(--chart-2)" stroke-width="1.4" stroke-dasharray="3 2"/>`;
    document.getElementById('chart-axis').innerHTML =
      [1, .75, .5, .25, 0].map(f => `<span>${axisLabel(SQ.NOW - span * f, span)}</span>`).join('');
    document.getElementById('chart-note').textContent = note;
  }

  document.querySelectorAll('#range button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#range button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      drawChart(b.dataset.r);
    });
  });

  const tbody = document.getElementById('tbody');
  const SCALE = SQ.maxLag(SQ.consumption);   // 全表共用一把刻度，带子长短才可横向比较

  function render(filter) {
    tbody.innerHTML = '';
    const rows = SQ.consumption.filter(c =>
      filter === 'lag' ? SQ.lagOf(c) > 0 : filter === 'dlq' ? c.dlq > 0 : true);

    rows.forEach((c, i) => {
      const lag = SQ.lagOf(c);
      const tr = document.createElement('tr');
      tr.className = 'row';
      tr.innerHTML = `
        <td class="mark ${SQ.markOf(c)}"></td>
        <td class="name"><a href="pages/group-detail.html?name=${c.group}">${c.group}</a><small>${c.topic}</small></td>
        <td><div class="rate"><span>${SQ.fmt(c.qps)}</span><svg width="60" height="20" data-sp="${i}"></svg></div></td>
        <td>${SQ.ribbon(c.cursor, c.head, c.fly, SCALE)}</td>
        <td class="num ${lag > 500 ? 'bad' : lag === 0 ? 'zero' : ''}">${SQ.fmt(lag)}</td>
        <td class="num ${c.fly ? '' : 'zero'}">${c.fly}</td>
        <td class="num ${c.dlq ? 'bad' : 'zero'}">${c.dlq}</td>
        <td class="num muted">${SQ.ago(c.lastMs)}</td>`;
      tbody.appendChild(tr);

      // 队列级明细用本行自己的最大落后量做刻度，否则队列间几十条的差异在全表刻度下看不见
      const qScale = Math.max(...c.queues.map(([, cu, hd]) => hd - cu), 1);
      const detail = document.createElement('tr');
      detail.className = 'detail';
      detail.hidden = true;
      detail.innerHTML = `<td colspan="8">
        <div class="detail-head">${c.queues.length} 个队列 · 刻度为本组内最大落后 ${SQ.fmt(qScale)} 条</div>
        <div class="qgrid">${c.queues.map(([q, cu, hd]) => `
          <div class="qrow">
            <span>queue ${q}</span>
            ${SQ.ribbon(cu, hd, 0, qScale, true)}
            <span style="text-align:right">落后 ${SQ.fmt(hd - cu)}</span>
          </div>`).join('')}</div>
        <div class="acts">
          <a class="btn" href="pages/group-detail.html?name=${c.group}">重置位点</a>
          <a class="btn" href="pages/dlq.html?group=${c.group}">查看死信</a>
          <a class="btn" href="pages/messages.html?topic=${c.topic}">查询消息</a>
        </div>
      </td>`;
      tbody.appendChild(detail);

      // 行内链接不应触发展开，否则点组名会同时跳页并展开
      tr.addEventListener('click', e => {
        if (e.target.closest('a')) return;
        detail.hidden = !detail.hidden;
      });
      SQ.spark(tr.querySelector('svg[data-sp]'), SQ.wave(24, c.qps || 40, (c.qps || 40) * .5, i), c.qps ? 'var(--chart-1)' : 'var(--text-3)');
    });
    document.getElementById('count').textContent = `${rows.length} / ${SQ.consumption.length} 条消费关系`;
  }

  let active = null;
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      active = active === chip.dataset.f ? null : chip.dataset.f;
      document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.f === active));
      render(active);
    });
  });

  render(null);
  drawChart('1h');
  window.addEventListener('resize', () => drawChart(document.querySelector('#range .active').dataset.r));
</script>
